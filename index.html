<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5x5 Mini-Male | Minimax AI</title>
  <style>
    :root {
      --bg-color: #1a1e26;
      --panel-bg: #232934;
      --panel-border: #343c4c;
      --square-light: #f0d9b5;
      --square-dark: #b58863;
      --selected: rgba(130, 195, 80, 0.7);
      --last-move: rgba(245, 230, 110, 0.55);
      --legal-dot: rgba(40, 140, 60, 0.75);
      --legal-capture: rgba(220, 50, 50, 0.75);
      --check-glow: rgba(235, 60, 60, 0.75);
      --text-light: #f0f3f6;
      --text-muted: #a0a8b6;
      --btn-bg: #374152;
      --btn-hover: #4b586e;
      --btn-accent: #2e7d32;
      --btn-accent-hover: #388e3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      gap: 30px;
      align-items: flex-start;
      max-width: 1000px;
      width: 100%;
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 860px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
    }

    /* Board Container */
    .board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board-coord-row {
      display: grid;
      grid-template-columns: 24px repeat(5, 75px) 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      font-weight: bold;
      color: var(--text-muted);
      font-size: 14px;
    }

    .board-middle {
      display: flex;
      align-items: center;
    }

    .board-coord-col {
      display: grid;
      grid-template-rows: repeat(5, 75px);
      width: 24px;
      line-height: 75px;
      text-align: center;
      font-weight: bold;
      color: var(--text-muted);
      font-size: 14px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 75px);
      grid-template-rows: repeat(5, 75px);
      width: 375px;
      height: 375px;
      border: 2px solid var(--panel-border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    @media (max-width: 480px) {
      .board-coord-row {
        grid-template-columns: 18px repeat(5, 58px) 18px;
        font-size: 11px;
      }
      .board-coord-col {
        grid-template-rows: repeat(5, 58px);
        line-height: 58px;
        width: 18px;
        font-size: 11px;
      }
      .board {
        grid-template-columns: repeat(5, 58px);
        grid-template-rows: repeat(5, 58px);
        width: 290px;
        height: 290px;
      }
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .square.light { background-color: var(--square-light); }
    .square.dark { background-color: var(--square-dark); }
    .square.selected { background-color: var(--selected) !important; }
    .square.last-move { background-color: var(--last-move); }

    .square.in-check {
      background: radial-gradient(circle, var(--check-glow) 0%, transparent 80%) !important;
    }

    .piece-img {
      width: 82%;
      height: 82%;
      pointer-events: none;
      transition: transform 0.1s ease;
    }

    /* Move hints */
    .hint-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--legal-dot);
      pointer-events: none;
    }

    .hint-capture {
      position: absolute;
      inset: 4px;
      border: 4px solid var(--legal-capture);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Sidebar */
    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 280px;
      width: 100%;
    }

    .header-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      background-color: var(--btn-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .status-badge.thinking {
      background-color: #2b3b55;
      color: #90caf9;
    }

    .status-badge.check {
      background-color: #8a3622;
      color: #ffccbc;
    }

    .status-badge.gameover {
      background-color: #7a2828;
      color: #ffebee;
    }

    .captures-box {
      background-color: #1c202a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .capture-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
    }

    .capture-label {
      color: var(--text-muted);
      width: 85px;
    }

    .capture-pieces {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
    }

    .capture-icon {
      width: 20px;
      height: 20px;
    }

    .history-card {
      background-color: #1c202a;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 120px;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .history-row {
      display: flex;
      gap: 16px;
    }

    .history-num {
      color: var(--text-muted);
      width: 25px;
    }

    .history-move {
      width: 70px;
    }

    /* Buttons */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background-color: var(--btn-bg);
      color: var(--text-light);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--btn-hover);
    }

    .btn-full {
      grid-column: span 2;
    }

    .btn-accent {
      background-color: var(--btn-accent);
      border-color: #388e3c;
    }

    .btn-accent:hover {
      background-color: var(--btn-accent-hover);
    }

    /* Promotion Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background-color: var(--panel-bg);
      border: 2px solid var(--btn-accent);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      max-width: 360px;
      width: 90%;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .promo-options {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .promo-btn {
      width: 65px;
      height: 65px;
      background-color: var(--btn-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .promo-btn:hover {
      background-color: var(--btn-hover);
      transform: scale(1.08);
      border-color: var(--btn-accent);
    }

    .promo-btn img {
      width: 80%;
      height: 80%;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Left: Chessboard -->
    <div class="board-wrapper">
      <div class="board-coord-row" id="top-coords">
        <div></div><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div></div>
      </div>
      <div class="board-middle">
        <div class="board-coord-col" id="left-coords">
          <div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
        </div>
        <div class="board" id="chessboard"></div>
        <div class="board-coord-col" id="right-coords">
          <div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
        </div>
      </div>
      <div class="board-coord-row" id="bottom-coords">
        <div></div><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div></div>
      </div>
    </div>

    <!-- Right: Sidebar Controls -->
    <div class="sidebar">
      <div class="header-title">
        <span>5x5 MINI-MALE</span>
      </div>

      <div class="status-badge" id="status-badge">Valge käik</div>

      <div class="captures-box">
        <div class="capture-row">
          <span class="capture-label">Valge võttis:</span>
          <div class="capture-pieces" id="white-captures"></div>
        </div>
        <div class="capture-row">
          <span class="capture-label">Must võttis:</span>
          <div class="capture-pieces" id="black-captures"></div>
        </div>
      </div>

      <div class="history-card">
        <div class="history-title">Käikude ajalugu</div>
        <div class="history-list" id="history-list"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-full" id="btn-difficulty">Raskusaste: Keskmine</button>
        <button class="btn" id="btn-side">Mängija: Valge</button>
        <button class="btn" id="btn-flip">Pööra laud</button>
        <button class="btn" id="btn-undo">Võta tagasi</button>
        <button class="btn btn-accent" id="btn-new">Uus mäng</button>
      </div>
    </div>
  </div>

  <!-- Promotion Dialog -->
  <div class="modal-overlay" id="promo-modal">
    <div class="modal-card">
      <div class="modal-title">Vali etturi asendus</div>
      <div class="promo-options" id="promo-options"></div>
    </div>
  </div>

      [-10,  -5,  -5,  -5, -10]
    ];
    const PST_ROOK_WHITE = [
      [ 15,  20,  25,  20,  15],
      [ 10,  15,  20,  15,  10],
      [  0,   5,  10,   5,   0],
      [  0,   0,   5,   0,   0],
      [  0,   5,  10,   5,   0]
    ];
    const PST_QUEEN = [
      [-10,  -5,   0,  -5, -10],
      [ -5,   5,  10,   5,  -5],
      [  0,  10,  20,  10,   0],
      [ -5,   5,  10,   5,  -5],
      [-10,  -5,   0,  -5, -10]
    ];
    const PST_KING_MID_WHITE = [
      [-30, -30, -30, -30, -30],
      [-20, -20, -20, -20, -20],
      [-10, -10, -10, -10, -10],
      [  5,   5,   0,   0,   5],
      [ 15,  20,  10,  10,  15]
    ];

    /* --- Board Logic --- */
    class Board {
      constructor() {
        this.grid = Array(5).fill(null).map(() => Array(5).fill(null));
        this.turn = WHITE;
        this.moveHistory = [];
        this.whiteKingPos = [4, 4];
        this.blackKingPos = [0, 4];
        this.capturedPieces = { [WHITE]: [], [BLACK]: [] };
        this.setupInitial();
      }

      setupInitial() {
        // Row 0 = Rank 5 (Black pieces)
        this.grid[0] = [
          { type: 'R', color: BLACK },
          { type: 'N', color: BLACK },
          { type: 'B', color: BLACK },
          { type: 'Q', color: BLACK },
          { type: 'K', color: BLACK }
        ];
        // Row 1 = Rank 4 (Black pawns)
        this.grid[1] = Array(5).fill(null).map(() => ({ type: 'P', color: BLACK }));
        // Row 2 = Rank 3 (Empty)
        this.grid[2] = Array(5).fill(null);
        // Row 3 = Rank 2 (White pawns)
        this.grid[3] = Array(5).fill(null).map(() => ({ type: 'P', color: WHITE }));
        // Row 4 = Rank 1 (White pieces)
        this.grid[4] = [
          { type: 'R', color: WHITE },
          { type: 'N', color: WHITE },
          { type: 'B', color: WHITE },
          { type: 'Q', color: WHITE },
          { type: 'K', color: WHITE }
        ];

        this.turn = WHITE;
        this.moveHistory = [];
        this.whiteKingPos = [4, 4];
        this.blackKingPos = [0, 4];
        this.capturedPieces = { [WHITE]: [], [BLACK]: [] };
      }

      clone() {
        const b = new Board();
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            b.grid[r][c] = this.grid[r][c] ? { ...this.grid[r][c] } : null;
          }
        }
        b.turn = this.turn;
        b.whiteKingPos = [...this.whiteKingPos];
        b.blackKingPos = [...this.blackKingPos];
        b.capturedPieces = {
          [WHITE]: [...this.capturedPieces[WHITE]],
          [BLACK]: [...this.capturedPieces[BLACK]]
        };
        b.moveHistory = this.moveHistory.map(m => ({ ...m }));
        return b;
      }

      isValid(r, c) {
        return r >= 0 && r < 5 && c >= 0 && c < 5;
      }

      isSquareAttacked(r, c, attackerColor) {
        // Pawn
        const pRow = (attackerColor === WHITE) ? r + 1 : r - 1;
        for (const pCol of [c - 1, c + 1]) {
          if (this.isValid(pRow, pCol)) {
            const p = this.grid[pRow][pCol];
            if (p && p.color === attackerColor && p.type === 'P') return true;
          }
        }

        // Knight
        const kOffsets = [[-2,-1], [-2,1], [-1,-2], [-1,2], [1,-2], [1,2], [2,-1], [2,1]];
        for (const [dr, dc] of kOffsets) {
          const nr = r + dr, nc = c + dc;
          if (this.isValid(nr, nc)) {
            const p = this.grid[nr][nc];
            if (p && p.color === attackerColor && p.type === 'N') return true;
          }
        }

        // King
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (this.isValid(nr, nc)) {
              const p = this.grid[nr][nc];
              if (p && p.color === attackerColor && p.type === 'K') return true;
            }
          }
        }

        // Orthogonal (Rook, Queen)
        const orthoDirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (const [dr, dc] of orthoDirs) {
          let nr = r + dr, nc = c + dc;
          while (this.isValid(nr, nc)) {
            const p = this.grid[nr][nc];
            if (p) {
              if (p.color === attackerColor && (p.type === 'R' || p.type === 'Q')) return true;
              break;
            }
            nr += dr; nc += dc;
          }
        }

        // Diagonal (Bishop, Queen)
        const diagDirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
        for (const [dr, dc] of diagDirs) {
          let nr = r + dr, nc = c + dc;
          while (this.isValid(nr, nc)) {
            const p = this.grid[nr][nc];
            if (p) {
              if (p.color === attackerColor && (p.type === 'B' || p.type === 'Q')) return true;
              break;
            }
            nr += dr; nc += dc;
          }
        }

        return false;
      }

      isInCheck(color) {
        const kPos = (color === WHITE) ? this.whiteKingPos : this.blackKingPos;
        return this.isSquareAttacked(kPos[0], kPos[1], -color);
      }

      getPseudoLegalMoves(color = this.turn) {
        const moves = [];
        const pDir = (color === WHITE) ? -1 : 1;
        const promoRow = (color === WHITE) ? 0 : 4;

        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const p = this.grid[r][c];
            if (!p || p.color !== color) continue;

            if (p.type === 'P') {
              // 1 step forward
              const fwdR = r + pDir;
              if (this.isValid(fwdR, c) && !this.grid[fwdR][c]) {
                if (fwdR === promoRow) {
                  for (const promo of ['Q', 'R', 'B', 'N']) {
                    moves.push({ from: [r, c], to: [fwdR, c], piece: p, captured: null, promotion: promo });
                  }
                } else {
                  moves.push({ from: [r, c], to: [fwdR, c], piece: p, captured: null, promotion: null });
                }
              }
              // Captures
              for (const dc of [-1, 1]) {
                const capC = c + dc;
                if (this.isValid(fwdR, capC)) {
                  const target = this.grid[fwdR][capC];
                  if (target && target.color !== color) {
                    if (fwdR === promoRow) {
                      for (const promo of ['Q', 'R', 'B', 'N']) {
                        moves.push({ from: [r, c], to: [fwdR, capC], piece: p, captured: target, promotion: promo });
                      }
                    } else {
                      moves.push({ from: [r, c], to: [fwdR, capC], piece: p, captured: target, promotion: null });
                    }
                  }
                }
              }
            } else if (p.type === 'N') {
              const offsets = [[-2,-1], [-2,1], [-1,-2], [-1,2], [1,-2], [1,2], [2,-1], [2,1]];
              for (const [dr, dc] of offsets) {
                const nr = r + dr, nc = c + dc;
                if (this.isValid(nr, nc)) {
                  const target = this.grid[nr][nc];
                  if (!target || target.color !== color) {
                    moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: target, promotion: null });
                  }
                }
              }
            } else if (p.type === 'B' || p.type === 'R' || p.type === 'Q') {
              const rays = [];
              if (p.type === 'B' || p.type === 'Q') rays.push([-1,-1], [-1,1], [1,-1], [1,1]);
              if (p.type === 'R' || p.type === 'Q') rays.push([-1,0], [1,0], [0,-1], [0,1]);
              for (const [dr, dc] of rays) {
                let nr = r + dr, nc = c + dc;
                while (this.isValid(nr, nc)) {
                  const target = this.grid[nr][nc];
                  if (!target) {
                    moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: null, promotion: null });
                  } else {
                    if (target.color !== color) {
                      moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: target, promotion: null });
                    }
                    break;
                  }
                  nr += dr; nc += dc;
                }
              }
            } else if (p.type === 'K') {
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  if (dr === 0 && dc === 0) continue;
                  const nr = r + dr, nc = c + dc;
                  if (this.isValid(nr, nc)) {
                    const target = this.grid[nr][nc];
                    if (!target || target.color !== color) {
                      moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: target, promotion: null });
                    }
                  }
                }
              }
            }
          }
        }
        return moves;
      }

      makeMove(m) {
        const [fr, fc] = m.from;
        const [tr, tc] = m.to;
        this.grid[fr][fc] = null;
        const placed = m.promotion ? { type: m.promotion, color: m.piece.color } : m.piece;
        this.grid[tr][tc] = placed;

        if (m.piece.type === 'K') {
          if (m.piece.color === WHITE) this.whiteKingPos = [tr, tc];
          else this.blackKingPos = [tr, tc];
        }

        if (m.captured) {
          this.capturedPieces[m.piece.color].push(m.captured);
        }

        this.moveHistory.push(m);
        this.turn = -this.turn;
      }

      undoMove() {
        if (this.moveHistory.length === 0) return null;
        const m = this.moveHistory.pop();
        this.turn = -this.turn;
        const [fr, fc] = m.from;
        const [tr, tc] = m.to;
        this.grid[fr][fc] = m.piece;
        this.grid[tr][tc] = m.captured;

        if (m.piece.type === 'K') {
          if (m.piece.color === WHITE) this.whiteKingPos = [fr, fc];
          else this.blackKingPos = [fr, fc];
        }

        if (m.captured) {
          this.capturedPieces[m.piece.color].pop();
        }
        return m;
      }

      getLegalMoves(color = this.turn) {
        const pseudos = this.getPseudoLegalMoves(color);
        const legals = [];
        for (const m of pseudos) {
          this.makeMove(m);
          if (!this.isInCheck(-this.turn)) {
            legals.push(m);
          }
          this.undoMove();
        }
        return legals;
      }

      isCheckmate() {
        return this.isInCheck(this.turn) && this.getLegalMoves().length === 0;
      }

      isStalemate() {
        return !this.isInCheck(this.turn) && this.getLegalMoves().length === 0;
      }

      recordMoveSan(move) {
        const symbol = PIECE_SYMBOLS_ET[move.piece.type];
        const sep = move.captured ? 'x' : '-';
        const fromStr = `${FILES[move.from[1]].toLowerCase()}${5 - move.from[0]}`;
        const toStr = `${FILES[move.to[1]].toLowerCase()}${5 - move.to[0]}`;
        const promoStr = move.promotion ? `=${PIECE_SYMBOLS_ET[move.promotion] || move.promotion}` : '';

        let suffix = '';
        if (this.isCheckmate()) suffix = '#';
        else if (this.isInCheck(this.turn)) suffix = '+';

        const san = `${symbol}${fromStr}${sep}${toStr}${promoStr}${suffix}`;
        move.san = san;
        return san;
      }

      getGameStatus() {
        if (this.isCheckmate()) {
          const winner = (this.turn === WHITE) ? 'Must' : 'Valge';
          return { over: true, msg: `Matt! ${winner} võitis!`, winner: -this.turn };
        }
        if (this.isStalemate()) {
          return { over: true, msg: 'Patt! Mäng on viigis.', winner: null };
        }
        if (this.isInCheck(this.turn)) {
          const curr = (this.turn === WHITE) ? 'Valge' : 'Must';
          return { over: false, msg: `Šahh! ${curr} on tule all.`, winner: null };
        }
        const curr = (this.turn === WHITE) ? 'Valge käik' : 'Must käik';
        return { over: false, msg: curr, winner: null };
      }
    }

    /* --- Minimax AI --- */
    class ChessAI {
      constructor(difficulty = 'keskmine') {
        this.difficulty = difficulty;
      }

      getPst(type, color, r, c) {
        const row = (color === WHITE) ? r : (4 - r);
        if (type === 'P') return PST_PAWN_WHITE[row][c];
        if (type === 'N') return PST_KNIGHT[row][c];
        if (type === 'B') return PST_BISHOP[row][c];
        if (type === 'R') return PST_ROOK_WHITE[row][c];
        if (type === 'Q') return PST_QUEEN[row][c];
        if (type === 'K') return PST_KING_MID_WHITE[row][c];
        return 0;
      }

      evaluate(board) {
        let score = 0;
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const p = board.grid[r][c];
            if (!p) continue;
            const val = PIECE_VALUES[p.type];
            const pst = this.getPst(p.type, p.color, r, c);
            const pieceScore = (p.type === 'K') ? pst : (val + pst);
            score += (p.color === WHITE) ? pieceScore : -pieceScore;
          }
        }
        if (board.isInCheck(BLACK)) score += 35;
        if (board.isInCheck(WHITE)) score -= 35;
        return score;
      }

      orderMoves(moves) {
        return moves.sort((a, b) => {
          let scoreA = 0, scoreB = 0;
          if (a.captured) scoreA = 10000 + PIECE_VALUES[a.captured.type] * 10 - PIECE_VALUES[a.piece.type];
          if (b.captured) scoreB = 10000 + PIECE_VALUES[b.captured.type] * 10 - PIECE_VALUES[b.piece.type];
          if (a.promotion) scoreA += 8000;
          if (b.promotion) scoreB += 8000;
          return scoreB - scoreA;
        });
      }

      minimax(board, depth, alpha, beta) {
        const legals = board.getLegalMoves();
        if (legals.length === 0) {
          if (board.isInCheck(board.turn)) return [-(100000 + depth), null];
          return [0, null];
        }

        if (depth === 0) {
          const evalScore = (board.turn === WHITE) ? this.evaluate(board) : -this.evaluate(board);
          return [evalScore, null];
        }

        const ordered = this.orderMoves(legals);
        let bestMove = ordered[0];
        let maxScore = -Infinity;

        for (const m of ordered) {
          board.makeMove(m);
          const [score] = this.minimax(board, depth - 1, -beta, -alpha);
          const currentScore = -score;
          board.undoMove();

          if (currentScore > maxScore) {
            maxScore = currentScore;
            bestMove = m;
          }
          alpha = Math.max(alpha, currentScore);
          if (alpha >= beta) break;
        }

        return [maxScore, bestMove];
      }

      getBestMove(board) {
        const legals = board.getLegalMoves();
        if (legals.length === 0) return null;
        if (legals.length === 1) return legals[0];

        const depth = (this.difficulty === 'lihtne') ? 2 : (this.difficulty === 'keskmine' ? 3 : 4);

        if (this.difficulty === 'lihtne') {
          // Add slight randomness among top 3 moves
          const scored = [];
          for (const m of legals) {
            board.makeMove(m);
            const [score] = this.minimax(board, depth - 1, -Infinity, Infinity);
            board.undoMove();
            scored.push({ score: -score, move: m });
          }
          scored.sort((a, b) => b.score - a.score);
          const top = scored.slice(0, Math.min(3, scored.length));
          const idx = Math.random() < 0.65 ? 0 : Math.floor(Math.random() * top.length);
          return top[idx].move;
        }

        const [, bestMove] = this.minimax(board, depth, -Infinity, Infinity);
        return bestMove || legals[0];
      }
    }

    /* --- Web UI Controller --- */
    const board = new Board();
    const ai = new ChessAI('keskmine');
    let humanColor = WHITE;
    let flipped = false;
    let selectedSq = null;
    let legalMovesForSelected = [];
    let pendingPromo = null;

    const elBoard = document.getElementById('chessboard');
    const elStatus = document.getElementById('status-badge');
    const elWhiteCaptures = document.getElementById('white-captures');
    const elBlackCaptures = document.getElementById('black-captures');
    const elHistoryList = document.getElementById('history-list');
    const elPromoModal = document.getElementById('promo-modal');
    const elPromoOptions = document.getElementById('promo-options');

    const btnDiff = document.getElementById('btn-difficulty');
    const btnSide = document.getElementById('btn-side');
    const btnFlip = document.getElementById('btn-flip');
    const btnUndo = document.getElementById('btn-undo');
    const btnNew = document.getElementById('btn-new');

    function squareToCoord(r, c) {
      return `${FILES[c]}${5 - r}`;
    }

    function renderBoard() {
      elBoard.innerHTML = '';
      const lastMove = board.moveHistory[board.moveHistory.length - 1];
      const inCheck = board.isInCheck(board.turn);
      const checkedKingPos = inCheck ? (board.turn === WHITE ? board.whiteKingPos : board.blackKingPos) : null;

      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 5; j++) {
          const r = flipped ? (4 - i) : i;
          const c = flipped ? (4 - j) : j;
          const isLight = (r + c) % 2 === 0;

          const sq = document.createElement('div');
          sq.className = `square ${isLight ? 'light' : 'dark'}`;
          sq.dataset.row = r;
          sq.dataset.col = c;

          if (selectedSq && selectedSq[0] === r && selectedSq[1] === c) {
            sq.classList.add('selected');
          }

          if (lastMove && ((lastMove.from[0] === r && lastMove.from[1] === c) || (lastMove.to[0] === r && lastMove.to[1] === c))) {
            sq.classList.add('last-move');
          }

          if (checkedKingPos && checkedKingPos[0] === r && checkedKingPos[1] === c) {
            sq.classList.add('in-check');
          }

          // Piece
          const p = board.grid[r][c];
          if (p) {
            const svgData = getPieceSvgData(p.type, p.color);
            const img = document.createElement('div');
            img.className = 'piece-img';
            img.innerHTML = svgData;
            sq.appendChild(img);
          }

          // Move hints
          const targetMove = legalMovesForSelected.find(m => m.to[0] === r && m.to[1] === c);
          if (targetMove) {
            if (p) {
              const cap = document.createElement('div');
              cap.className = 'hint-capture';
              sq.appendChild(cap);
            } else {
              const dot = document.createElement('div');
              dot.className = 'hint-dot';
              sq.appendChild(dot);
            }
          }

          sq.addEventListener('click', () => onSquareClick(r, c));
          elBoard.appendChild(sq);
        }
      }

      updateCoords();
      updateSidebar();
    }

    function updateCoords() {
      const topRow = document.getElementById('top-coords');
      const botRow = document.getElementById('bottom-coords');
      const leftCol = document.getElementById('left-coords');
      const rightCol = document.getElementById('right-coords');

      const files = flipped ? [...FILES].reverse() : FILES;
      const ranks = flipped ? ['1','2','3','4','5'] : ['5','4','3','2','1'];

      topRow.innerHTML = '<div></div>' + files.map(f => `<div>${f}</div>`).join('') + '<div></div>';
      botRow.innerHTML = '<div></div>' + files.map(f => `<div>${f}</div>`).join('') + '<div></div>';
      leftCol.innerHTML = ranks.map(r => `<div>${r}</div>`).join('');
      rightCol.innerHTML = ranks.map(r => `<div>${r}</div>`).join('');
    }

    function updateSidebar() {
      const status = board.getGameStatus();
      elStatus.textContent = status.msg;
      elStatus.className = 'status-badge';

      if (status.over) {
        elStatus.classList.add('gameover');
      } else if (board.isInCheck(board.turn)) {
        elStatus.classList.add('check');
      }

      // Captures
      elWhiteCaptures.innerHTML = board.capturedPieces[WHITE].map(p =>
        `<div class="capture-icon">${getPieceSvgData(p.type, BLACK)}</div>`
      ).join('');

      elBlackCaptures.innerHTML = board.capturedPieces[BLACK].map(p =>
        `<div class="capture-icon">${getPieceSvgData(p.type, WHITE)}</div>`
      ).join('');

      // History
      let histHtml = '';
      for (let i = 0; i < board.moveHistory.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = board.moveHistory[i].san || '';
        const bMove = (i + 1 < board.moveHistory.length) ? (board.moveHistory[i + 1].san || '') : '';
        histHtml += `<div class="history-row"><span class="history-num">${moveNum}.</span><span class="history-move">${wMove}</span><span class="history-move">${bMove}</span></div>`;
      }
      elHistoryList.innerHTML = histHtml;
      elHistoryList.scrollTop = elHistoryList.scrollHeight;
    }

    function onSquareClick(r, c) {
      if (pendingPromo) return;
      if (board.turn !== humanColor) return;
      if (board.getGameStatus().over) return;

      const p = board.grid[r][c];

      if (selectedSq) {
        const matchingMoves = legalMovesForSelected.filter(m => m.to[0] === r && m.to[1] === c);
        if (matchingMoves.length > 0) {
          // Check if promotion
          const promoRow = (humanColor === WHITE) ? 0 : 4;
          if (matchingMoves[0].piece.type === 'P' && r === promoRow) {
            showPromoModal(matchingMoves);
            return;
          }

          // Execute move
          executeMove(matchingMoves[0]);
          return;
        }

        if (p && p.color === humanColor) {
          selectedSq = [r, c];
          legalMovesForSelected = board.getLegalMoves().filter(m => m.from[0] === r && m.from[1] === c);
          renderBoard();
          return;
        }

        selectedSq = null;
        legalMovesForSelected = [];
        renderBoard();
      } else {
        if (p && p.color === humanColor) {
          selectedSq = [r, c];
          legalMovesForSelected = board.getLegalMoves().filter(m => m.from[0] === r && m.from[1] === c);
          renderBoard();
        }
      }
    }

    function showPromoModal(promoMoves) {
      pendingPromo = promoMoves;
      elPromoOptions.innerHTML = '';
      for (const pType of ['Q', 'R', 'B', 'N']) {
        const btn = document.createElement('div');
        btn.className = 'promo-btn';
        btn.innerHTML = getPieceSvgData(pType, humanColor);
        btn.addEventListener('click', () => {
          const chosen = pendingPromo.find(m => m.promotion === pType);
          elPromoModal.classList.remove('active');
          pendingPromo = null;
          if (chosen) executeMove(chosen);
        });
        elPromoOptions.appendChild(btn);
      }
      elPromoModal.classList.add('active');
    }

    function executeMove(move) {
      board.makeMove(move);
      board.recordMoveSan(move);
      selectedSq = null;
      legalMovesForSelected = [];
      renderBoard();

      if (!board.getGameStatus().over && board.turn !== humanColor) {
        triggerAi();
      }
    }

    function triggerAi() {
      elStatus.textContent = 'Arvuti mõtleb...';
      elStatus.className = 'status-badge thinking';

      setTimeout(() => {
        const bestMove = ai.getBestMove(board);
        if (bestMove && !board.getGameStatus().over) {
          board.makeMove(bestMove);
          board.recordMoveSan(bestMove);
        }
        renderBoard();
      }, 120);
    }

    /* --- Button Event Handlers --- */
    btnDiff.addEventListener('click', () => {
      const diffs = ['lihtne', 'keskmine', 'raske'];
      const next = diffs[(diffs.indexOf(ai.difficulty) + 1) % diffs.length];
      ai.difficulty = next;
      btnDiff.textContent = `Raskusaste: ${next.charAt(0).toUpperCase() + next.slice(1)}`;
    });

    btnSide.addEventListener('click', () => {
      humanColor = -humanColor;
      flipped = (humanColor === BLACK);
      btnSide.textContent = (humanColor === WHITE) ? 'Mängija: Valge' : 'Mängija: Must';
      board.setupInitial();
      selectedSq = null;
      legalMovesForSelected = [];
      renderBoard();
      if (board.turn !== humanColor) triggerAi();
    });

    btnFlip.addEventListener('click', () => {
      flipped = !flipped;
      renderBoard();
    });

    btnUndo.addEventListener('click', () => {
      if (board.moveHistory.length === 0) return;
      board.undoMove();
      if (board.turn !== humanColor && board.moveHistory.length > 0) {
        board.undoMove();
      }
      selectedSq = null;
      legalMovesForSelected = [];
      renderBoard();
    });

    btnNew.addEventListener('click', () => {
      board.setupInitial();
      selectedSq = null;
      legalMovesForSelected = [];
      renderBoard();
      if (board.turn !== humanColor) triggerAi();
    });

    // Start
    renderBoard();
  </script>
</body>
</html>
